<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1868db">
<title>Diagrams</title>
<link rel="stylesheet" href="/static/host.css">
</head>
<body>
<header id="bar" class="bar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
      <rect width="24" height="24" rx="6" fill="#fff"/>
      <g fill="none" stroke="#1868db" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="5" width="6" height="5" rx="1.2"/>
        <rect x="13.5" y="14" width="6" height="5" rx="1.2"/>
        <path d="M10.5 7.5h3.5a2 2 0 0 1 2 2V14"/>
      </g>
    </svg>
    <a class="brand-name" id="home" href="/">Diagrams</a>
  </div>
  <span id="status" class="status" data-state="loading" role="status" aria-live="polite">Loading…</span>
  <span class="grow"></span>
  <div id="presence" class="presence" aria-label="People in this diagram"></div>
  <div id="user" class="user" hidden>
    <span id="avatar" class="avatar" aria-hidden="true"></span>
    <span id="who" class="user-name"></span>
    <span id="role" class="role" hidden>admin</span>
  </div>
  <button id="logout" class="btn-signout" type="button" aria-label="Sign out">
    <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span id="logout-label" class="btn-label">Sign out</span>
  </button>
</header>

<main id="list-view" class="view" hidden>
  <div class="list-head">
    <h1>Diagrams</h1>
    <span class="grow"></span>
    <input id="filter" class="field" type="search" placeholder="Search diagrams" aria-label="Search diagrams" autocomplete="off">
    <select id="scope" class="field" aria-label="Filter">
      <option value="all">All</option><option value="mine">Owned by me</option><option value="shared">Shared with me</option>
    </select>
    <button id="import" class="btn" type="button">Import…</button>
    <button id="new" class="btn primary" type="button">New diagram</button>
    <input id="import-file" type="file" accept=".drawio,.xml,text/xml,application/xml" hidden>
  </div>
  <div id="docs" class="docs" role="list"></div>
  <p id="empty" class="empty" hidden>No diagrams yet. Create one or import a .drawio file.</p>
</main>

<section id="editor-view" class="view editor-view" hidden>
  <div class="subbar">
    <a class="btn ghost" id="back" href="/">← Diagrams</a>
    <input id="title" class="title" type="text" maxlength="200" aria-label="Diagram title" spellcheck="false">
    <span id="rolebadge" class="rolebadge" hidden></span>
    <span class="grow"></span>
    <button id="btn-comments" class="btn ghost" type="button">Comments</button>
    <button id="btn-history" class="btn ghost" type="button">History</button>
    <button id="btn-versions" class="btn ghost" type="button">Versions</button>
    <button id="btn-export" class="btn ghost" type="button">Export</button>
    <button id="btn-share" class="btn primary" type="button">Share</button>
  </div>
  <div class="editor-row">
    <iframe id="editor" title="draw.io editor" hidden></iframe>
    <aside id="panel" class="panel" hidden>
      <div class="panel-head"><strong id="panel-title"></strong><span class="grow"></span><button id="panel-close" class="btn ghost" type="button" aria-label="Close">✕</button></div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </div>
  <div id="banner" class="banner" hidden></div>
</section>

<dialog id="dlg" class="dlg"><form method="dialog" id="dlg-form"><h2 id="dlg-title"></h2><div id="dlg-body" class="dlg-body"></div><div class="dlg-actions" id="dlg-actions"></div></form></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/model.js"></script>
<script src="/static/bridge.js"></script>
<script src="/static/adapter.js"></script>
<script src="/static/host.js"></script>
</body>
</html>
