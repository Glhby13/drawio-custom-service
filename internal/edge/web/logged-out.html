<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<title>Signed out · Diagrams</title>

</head>
<body>
<main class="shell">
  <section class="card" role="status" aria-live="polite">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="24" height="24" rx="6" fill="#1868db"/>
        <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="5" width="6" height="5" rx="1.2"/>
          <rect x="13.5" y="14" width="6" height="5" rx="1.2"/>
          <path d="M10.5 7.5h3.5a2 2 0 0 1 2 2V14"/>
        </g>
      </svg>
      <span class="brand-name">Diagrams</span>
    </div>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
      </svg>
    </div>
    <h1>You’re signed out</h1>
    <p class="lead">Your session has ended. Sign in again whenever you want to continue.</p>
    <a class="btn" href="/login">Sign in again</a>
    <p class="hint">Using a shared computer? Close this tab as well.</p>
  </section>
</main>
