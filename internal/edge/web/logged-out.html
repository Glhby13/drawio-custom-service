<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1868db">
<title>Signed out · DrawSpace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--STYLE-->
</head>
<body>
<main class="shell">
  <section class="card" role="status" aria-live="polite">
    <div class="brand">
      <picture>
        <source srcset="/login-assets/logo-dark.png" media="(prefers-color-scheme: dark)">
        <img class="brand-logo" src="/login-assets/logo-light.png" alt="DrawSpace" width="220">
      </picture>
    </div>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
      </svg>
    </div>
    <h1>You’re signed out</h1>
    <p class="lead">Your session has ended. Sign in again whenever you want to continue.</p>
    <a class="btn" href="/login">Sign in again</a>
    <p class="hint">Using a shared computer? Close this tab as well.</p>
  </section>
</main>
</body>
</html>
