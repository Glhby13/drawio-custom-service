<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b57f0">
<title>Sign in · DrawSpace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--STYLE-->
</head>
<body>
<main class="shell">
  <section class="card">
    <div class="brand">
      <picture>
        <source srcset="/login-assets/drawspace-icon.svg" media="(max-width: 300px)">
        <source srcset="/login-assets/drawspace-logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="brand-logo" src="/login-assets/drawspace-logo.svg" alt="DrawSpace - DESIGN · CONNECT · COLLABORATE" width="300" height="82">
      </picture>
      <span class="wordmark" hidden aria-hidden="true"><b>Draw</b>Space</span>
    </div>
    <p class="tagline" hidden aria-hidden="true">DESIGN · CONNECT · COLLABORATE</p>
    <h1>Sign in</h1>
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle" type="button" class="ghost" aria-label="Show password">Show</button>
      </div>
      <div id="totp-row" class="totp-row" hidden>
        <label for="totp">Authenticator code (TOTP)</label>
        <input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="6-digit code">
      </div>
      <p id="err" class="err" role="alert" hidden></p>
      <button id="submit" class="btn primary" type="submit">Sign in with AD BTN</button>
      <div class="or"><span>or</span></div>
      <button id="local-btn" class="btn secondary" type="button">Sign in with local account</button>
      <a id="sso" href="/login/sso" hidden aria-hidden="true" tabindex="-1"></a>
    </form>
    <p class="hint">AD BTN uses your company credentials. Local accounts are created by an administrator.</p>
  </section>
</main>
<script src="/login-assets/login.js"></script>
</body>
</html>
