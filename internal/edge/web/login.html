<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b57f0">
<title>Sign in · DrawSpace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--STYLE-->
</head>
<body>
<main class="shell">
  <section class="card">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" width="46" height="46" aria-hidden="true" focusable="false">
        <g fill="none" stroke="#0b57f0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M64 28H40a15 15 0 0 0-3 29.7l26 5.6a15 15 0 0 1-3 29.7H30"/></g>
        <rect x="63" y="5" width="22" height="22" rx="6" fill="#ff2a2a"/><rect x="10" y="76" width="22" height="22" rx="6" fill="#0b57f0"/>
      </svg>
      <span class="wordmark"><b>Draw</b>Space</span>
    </div>
    <p class="tagline">DESIGN · CONNECT · COLLABORATE</p>
    <h1>Sign in</h1>
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle" type="button" class="ghost" aria-label="Show password">Show</button>
      </div>
      <p id="err" class="err" role="alert" hidden></p>
      <button id="submit" class="btn primary" type="submit">Sign in</button>
    </form>
    <div class="or"><span>or</span></div>
    <a id="sso" class="btn secondary" href="/login/sso">Sign in with SSO</a>
    <p class="hint">Local accounts are created by an administrator. SSO uses your company account.</p>
  </section>
</main>
<script src="/login-assets/login.js"></script>
</body>
</html>
