<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b57f0">
<title>Sign in · DrawSpace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--STYLE-->
</head>
<body>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle day or night mode" title="Switch theme">
  <span id="theme-icon" class="theme-icon" aria-hidden="true"></span>
</button>
<main class="shell">
  <section class="card">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" src="/login-assets/drawspace-logo.svg" alt="DrawSpace - DESIGN · CONNECT · COLLABORATE" width="300" height="82">
      <span class="wordmark" hidden aria-hidden="true"><b>Draw</b>Space</span>
    </div>
    <p class="tagline" hidden aria-hidden="true">DESIGN · CONNECT · COLLABORATE</p>
    <h1>Sign in</h1>
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle" type="button" class="ghost" aria-label="Show password">Show</button>
      </div>
      <div id="err" class="err" role="alert" hidden>
        <span id="err-text" class="err-text"></span>
        <button id="err-close" class="err-close" type="button" aria-label="Close message">✕</button>
      </div>
      <button id="submit" class="btn primary" type="submit">Sign in with AD BTN</button>
      <div class="or"><span>or</span></div>
      <button id="local-btn" class="btn secondary" type="button">Sign in with local account</button>
      <a id="sso" href="/login/sso" hidden aria-hidden="true" tabindex="-1"></a>
    </form>
    <p class="hint">© 2026 PT Bank Tabungan Negara (Persero) Tbk<br>Tim Platform Engineering</p>
  </section>
</main>

<div id="totp-modal" class="totp-modal-backdrop" hidden>
  <div class="totp-modal-card" role="dialog" aria-modal="true" aria-labelledby="totp-modal-title">
    <div class="totp-icon-wrap" aria-hidden="true">
      <svg class="totp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2 id="totp-modal-title">Two-Factor Authentication</h2>
    <p id="totp-modal-desc" class="totp-desc">Akun admin dilindungi verifikasi dua langkah. Masukkan 6-digit kode dari aplikasi authenticator Anda.</p>
    <div id="modal-qr-container" class="modal-qr-container" hidden>
      <img id="modal-qr-img" class="modal-qr-img" alt="QR Code Authenticator">
      <div class="modal-secret-wrap">Key manual: <span id="modal-secret-text" class="modal-secret-code"></span></div>
    </div>
    <form id="totp-modal-form" novalidate>
      <label for="modal-totp-input">Kode Authenticator (TOTP)</label>
      <input id="modal-totp-input" name="totp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
      <div id="modal-err" class="err" role="alert" hidden>
        <span id="modal-err-text" class="err-text"></span>
        <button id="modal-err-close" class="err-close" type="button" aria-label="Close message">✕</button>
      </div>
      <button id="modal-submit-btn" class="btn primary" type="submit">Verifikasi &amp; Masuk</button>
      <button id="modal-cancel-btn" class="btn secondary" type="button">Batal</button>
    </form>
  </div>
</div>
<script src="/login-assets/login.js"></script>
</body>
</html>
