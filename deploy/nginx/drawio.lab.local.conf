# drawio.lab.local - the single browser entry point (drawio-custom-service gateway, ADR-0003). TLS ends here (nginx VM),
# traffic goes to ingress-nginx, whose Ingress `drawio-gateway` (lab-dev) routes to the gateway Service. No other
# route to draw.io exists. Install: /etc/nginx/sites-available + symlink in sites-enabled, `nginx -t && nginx -s reload`.
# Lab file, not part of GitOps (the nginx VM is managed by hand / nginx-ui). WebSocket upgrade is enabled for Phase 5.
map $http_upgrade $drawio_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name drawio.lab.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name drawio.lab.local;

    ssl_certificate     /etc/ssl/certs/star_lab_local_fullchain.pem;
    ssl_certificate_key /etc/ssl/private/star.lab.local.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://ingress-nginx-http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $drawio_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
